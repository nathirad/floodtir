[tool.uv.workspace]
members = ["apps/api"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["api"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
